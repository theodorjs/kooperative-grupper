<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Fargevalget settes før siden tegnes, så den ikke blinker (se src/data/fargetema.js).
      try {
        var valg = localStorage.getItem('kooperative-grupper-fargetema');
        if (valg === 'mork') document.documentElement.setAttribute('data-theme', 'dark');
        if (valg === 'lys') document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {}
      // Skolefarger når adressen begynner med skolens prefiks (se src/data/skoletema.js).
      // ?skole=<id> forhåndsviser, ?skole=ingen slår av.
      // Egen try, så skolefargene kommer selv om nettleseren stenger lagringen.
      try {
        var skoler = { 'torderod': 'torderod' }; // prefiks: skole-id
        var vert = location.hostname.toLowerCase().replace(/^www\./, '');
        var skole = null;
        for (var prefiks in skoler) if (!skole && vert.startsWith(prefiks)) skole = skoler[prefiks];
        var onsket = new URLSearchParams(location.search).get('skole');
        if (onsket === 'ingen') skole = null;
        for (prefiks in skoler) if (skoler[prefiks] === onsket) skole = onsket;
        if (skole) document.documentElement.setAttribute('data-skole', skole);
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Kooperative grupper</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
