<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Fargevalget settes før siden tegnes, så den ikke blinker (se src/data/fargetema.js).
      try {
        var valg = localStorage.getItem('kooperative-grupper-fargetema');
        if (valg === 'mork') document.documentElement.setAttribute('data-theme', 'dark');
        if (valg === 'lys') document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Kooperative grupper</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
