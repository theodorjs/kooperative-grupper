name: Test og publiser

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Henter skoleruta til Moss kommune på nytt hver mandag morgen.
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      # Feiler hentingen, brukes feriene fra forrige publisering. Se loggen for detaljer.
      # På pull requests er dette bare en prøve med full diagnose; ingenting publiseres.
      - name: Hent ferier fra Moss kommune
        env:
          HENDELSE: ${{ github.event_name }}
          RESERVE: ${{ steps.pages.outputs.base_url }}/ferier-moss.json
        run: |
          if [ "$HENDELSE" = "pull_request" ]; then
            node scripts/hent-ferier.mjs --diagnose
          else
            node scripts/hent-ferier.mjs --reserve "$RESERVE"
          fi

      - run: npm run build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publiser:
    if: github.event_name != 'pull_request'
    needs: bygg
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publisering.outputs.page_url }}
    steps:
      - id: publisering
        uses: actions/deploy-pages@v4
